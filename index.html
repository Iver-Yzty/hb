<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111726" />
    <title>生日快乐 · 3D 星河蛋糕</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A2238'/%3E%3Cpath d='M32 12c2.4 12 6.6 16.2 18.6 18.6C38.6 33 34.4 37.2 32 49.2 29.6 37.2 25.4 33 13.4 30.6 25.4 28.2 29.6 24 32 12Z' fill='%23FFD166'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* ── 独立试作页：3D 星河丝带蛋糕 ───────────────────────── */

      /* 字体全部本地打包（只含页面实际用到的字），国内无需访问 Google Fonts */
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/cormorant-garamond-latin.woff2") format("woff2");
        font-weight: 400 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/cormorant-garamond-italic.woff2") format("woff2");
        font-weight: 400 600;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "Noto Serif SC";
        src: url("assets/fonts/noto-serif-sc-visible.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Noto Serif SC";
        src: url("assets/fonts/noto-serif-sc-visible.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      body.theme-night {
        background: #070b14;
      }

      /* 默认：原始代码的深海星河色系 */
      .scene--star {
        background:
          radial-gradient(
            95% 62% at 50% 46%,
            rgba(30, 64, 140, 0.42) 0%,
            rgba(13, 29, 64, 0.28) 42%,
            transparent 74%
          ),
          radial-gradient(
            135% 85% at 50% 38%,
            #15234a 0%,
            #0e1830 52%,
            #070b14 100%
          );
      }
      .scene--star .night-glow {
        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.2) 0%,
          rgba(29, 78, 216, 0.1) 38%,
          transparent 68%
        );
      }
      .scene--star .night-horizon {
        background: radial-gradient(
          ellipse at 50% 100%,
          rgba(56, 189, 248, 0.14),
          transparent 64%
        );
      }
      .scene--star .bokeh--a {
        background: rgba(56, 189, 248, 0.5);
        box-shadow: 0 0 18px rgba(56, 189, 248, 0.4);
      }
      .scene--star .bokeh--b {
        background: rgba(255, 105, 180, 0.45);
        box-shadow: 0 0 16px rgba(255, 105, 180, 0.35);
      }
      .scene--star .bokeh--c {
        background: rgba(125, 223, 242, 0.35);
        box-shadow: 0 0 22px rgba(125, 223, 242, 0.3);
      }

      .scene--star .finale-title--art {
        position: relative;
        isolation: isolate;
        display: block;
        width: min(88vw, 372px);
        margin: 0;
        line-height: 0;
        letter-spacing: 0;
        text-indent: 0;
        text-shadow: none;
        color: transparent;
        filter: drop-shadow(0 12px 34px rgba(5, 12, 30, 0.55));
        pointer-events: auto;
        transform: translate3d(
          calc(var(--tp-x, 0px) * 0.6),
          calc(var(--tp-y, 0px) * 0.6),
          0
        );
        transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform;
      }
      .scene--star .finale-title--art img {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: auto;
        -webkit-user-drag: none;
        user-select: none;
        animation: titleFloat 7.5s ease-in-out infinite;
      }
      .scene--star .finale-title--art .title-glow {
        position: absolute;
        left: 50%;
        top: 52%;
        width: 124%;
        height: 128%;
        transform: translate(-50%, -50%);
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(
            46% 46% at 50% 50%,
            rgba(123, 223, 242, 0.2),
            transparent 70%
          ),
          radial-gradient(
            38% 40% at 63% 46%,
            rgba(255, 182, 193, 0.16),
            transparent 72%
          ),
          radial-gradient(
            40% 34% at 50% 70%,
            rgba(255, 231, 163, 0.12),
            transparent 74%
          );
        filter: blur(14px);
        animation: titleGlow 8s ease-in-out infinite;
      }
      .scene--star .finale-title--art .title-sparks {
        position: absolute;
        inset: -8% -5%;
        z-index: 2;
        pointer-events: none;
      }
      .title-sparks i {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--s, 7px);
        height: var(--s, 7px);
        background: var(--c, #7bdff2);
        clip-path: polygon(
          50% 0%,
          58% 42%,
          100% 50%,
          58% 58%,
          50% 100%,
          42% 58%,
          0% 50%,
          42% 42%
        );
        filter: drop-shadow(0 0 5px var(--c, #7bdff2));
        opacity: 0.2;
        translate: calc(var(--tp-x, 0px) * 1.7) calc(var(--tp-y, 0px) * 1.7);
        transition: translate 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        animation: titleSpark var(--t, 4.4s) ease-in-out var(--d, 0s) infinite;
      }
      .finale-title--art.is-sparking .title-sparks i {
        animation: titleSparkBurst 0.9s ease-out both;
      }
      .scene--star .starfield {
        transform: translate3d(
            calc(var(--mx, 0) * 6px),
            calc(var(--my, 0) * 6px),
            0
          )
          scale(1.04);
        transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform;
      }

      @keyframes titleFloat {
        0%,
        100% {
          transform: translateY(0) rotate(-0.25deg);
        }
        50% {
          transform: translateY(-4px) rotate(0.25deg);
        }
      }
      @keyframes titleGlow {
        0%,
        100% {
          opacity: 0.72;
          transform: translate(-50%, -50%) scale(0.98);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -51%) scale(1.06);
        }
      }
      @keyframes titleSpark {
        0%,
        100% {
          opacity: 0.15;
          scale: 0.55;
        }
        50% {
          opacity: 1;
          scale: 1;
        }
      }
      @keyframes titleSparkBurst {
        0% {
          opacity: 1;
          scale: 1.7;
        }
        100% {
          opacity: 0.2;
          scale: 0.65;
        }
      }
      @media (min-width: 760px) {
        .scene--star .finale-title--art {
          width: min(46vw, 430px);
        }
      }
      .scene--star .blow-hint {
        color: rgba(224, 242, 254, 0.8);
      }
      .scene--star .blow-hint::after {
        background: linear-gradient(
          90deg,
          transparent,
          rgba(56, 189, 248, 0.75),
          transparent
        );
      }

      .star-topbar {
        position: fixed;
        z-index: 52;
        top: calc(var(--safe-top) + 14px);
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(16px, 5vw, 28px);
        pointer-events: none;
      }
      .star-topbar > * {
        pointer-events: auto;
      }

      .star-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 2px;
        color: rgba(186, 230, 253, 0.66);
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
        transition: color 0.35s;
      }
      .star-back:hover {
        color: #e0f2fe;
      }

      .star-badge {
        font-family: var(--serif);
        font-style: italic;
        font-size: 10px;
        letter-spacing: 0.24em;
        color: rgba(125, 211, 252, 0.45);
        user-select: none;
      }

      /* 香槟金版：index.html?theme=gold */
      .cake-gold .scene--star {
        background:
          radial-gradient(
            95% 62% at 50% 46%,
            rgba(64, 55, 72, 0.55) 0%,
            rgba(32, 40, 64, 0.35) 42%,
            transparent 74%
          ),
          radial-gradient(
            135% 85% at 50% 38%,
            #2a3554 0%,
            #1a2238 52%,
            #111726 100%
          );
      }
      .cake-gold .scene--star .night-glow {
        background: radial-gradient(
          circle,
          rgba(255, 209, 102, 0.22) 0%,
          rgba(230, 194, 128, 0.09) 38%,
          transparent 68%
        );
      }
      .cake-gold .scene--star .night-horizon {
        background: radial-gradient(
          ellipse at 50% 100%,
          rgba(255, 196, 110, 0.13),
          transparent 64%
        );
      }
      .cake-gold .scene--star .bokeh--a {
        background: rgba(255, 209, 102, 0.5);
        box-shadow: 0 0 18px rgba(255, 209, 102, 0.4);
      }
      .cake-gold .scene--star .bokeh--b {
        background: rgba(243, 232, 255, 0.5);
        box-shadow: 0 0 16px rgba(243, 232, 255, 0.35);
      }
      .cake-gold .scene--star .bokeh--c {
        background: rgba(230, 194, 128, 0.35);
        box-shadow: 0 0 22px rgba(230, 194, 128, 0.3);
      }

      .cake-gold .scene--star .blow-hint {
        color: rgba(255, 240, 210, 0.82);
      }
      .cake-gold .scene--star .blow-hint::after {
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 209, 102, 0.75),
          transparent
        );
      }
      .cake-gold .star-back {
        color: rgba(243, 226, 185, 0.66);
      }
      .cake-gold .star-back:hover {
        color: #ffe9b8;
      }
      .cake-gold .star-badge {
        color: rgba(230, 194, 128, 0.5);
      }

      .cake-canvas {
        position: absolute;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
        -webkit-tap-highlight-color: transparent;
        transition: opacity 0.7s ease;
      }
      /* 贺卡挡住了蛋糕时，让蛋糕淡出，只留下画面里的星空 */
      .scene--star .cake-canvas.is-tucked {
        opacity: 0;
      }
      .cake-canvas:active {
        cursor: grabbing;
      }

      .star-inner {
        justify-content: flex-start;
        gap: 0;
        pointer-events: none;
      }

      .star-inner .finale-head {
        padding-top: 2px;
        flex: 0 0 auto;
      }

      .star-inner .blow-hint {
        position: absolute;
        left: 50%;
        top: 68%;
        z-index: 8;
        margin: 0;
        transform: translateX(-50%);
        white-space: nowrap;
        pointer-events: auto;
      }
      .scene--star.is-blown .blow-hint {
        transform: translate(-50%, 8px);
      }

      .star-inner .wish-card {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        margin: 0;
        pointer-events: auto;
        width: min(90%, 390px);
      }

      .scene--star.is-card .wish-card {
        max-height: min(520px, 68vh);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
      }
      .scene--star.is-card .wish-card::-webkit-scrollbar {
        display: none;
      }

      /* 贺卡顶部的三张贴纸小照片，像随手贴在卡片上的装饰 */
      .wish-card .wish-photos {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        height: clamp(96px, 26vw, 122px);
        margin: 0 auto clamp(11px, 2.8vw, 15px);
      }
      .wish-card .wish-photos img {
        display: block;
        height: 100%;
        width: auto;
        -webkit-user-drag: none;
        user-select: none;
        filter: drop-shadow(0 5px 10px rgba(92, 66, 32, 0.24));
      }
      .wish-card .wish-photos img:nth-child(1) {
        transform: rotate(-7deg) translate(7px, 5px);
        z-index: 1;
        margin-right: -13px;
      }
      .wish-card .wish-photos img:nth-child(2) {
        height: 110%;
        transform: rotate(1.5deg) translateY(-4px);
        z-index: 3;
      }
      .wish-card .wish-photos img:nth-child(3) {
        transform: rotate(8deg) translate(-7px, 7px);
        z-index: 2;
        margin-left: -13px;
      }
      .scene--finale.is-card .wish-photos {
        animation-delay: 0.42s;
      }

      /* 去掉署名后，用一枚小小的金色分隔收尾 */
      .wish-card .wish-ornament {
        display: block;
        position: relative;
        width: 104px;
        height: 8px;
        margin: 13px auto 0;
        background: radial-gradient(
            circle,
            rgba(174, 124, 54, 0.85) 0 1.6px,
            rgba(174, 124, 54, 0) 2px
          )
          center/6px 6px no-repeat;
      }
      .wish-card .wish-ornament::before,
      .wish-card .wish-ornament::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 40px;
        height: 1px;
        background: linear-gradient(
          90deg,
          rgba(185, 138, 71, 0),
          rgba(185, 138, 71, 0.55)
        );
      }
      .wish-card .wish-ornament::before {
        left: 0;
      }
      .wish-card .wish-ornament::after {
        right: 0;
        transform: scaleX(-1);
      }
      .scene--finale.is-card .wish-ornament {
        animation-delay: 1.2s;
      }

      /* 正文保持居中；底部留出落款的位置，像信末签名一样自然错开 */
      .wish-card .wish-card-inner {
        padding-bottom: calc(
          clamp(17px, 4.4vw, 24px) + clamp(50px, 16vw, 62px)
        );
      }

      /* 右下角的手绘头像，当作落款 */
      .wish-card .wish-signature {
        position: absolute;
        right: 11px;
        bottom: 14px;
        width: clamp(56px, 17vw, 68px);
        height: auto;
        pointer-events: none;
      }
      .wish-card .wish-signature img {
        display: block;
        width: 100%;
        height: auto;
        transform: rotate(-7deg);
        opacity: 0.9;
        filter: drop-shadow(0 1px 1px rgba(120, 92, 48, 0.1));
      }
      .scene--finale.is-card .wish-signature {
        animation-delay: 1.16s;
      }

      @media (max-width: 640px) {
        /* 手机上贺卡整体上移一点，离底部水印更从容 */
        .star-inner .wish-card {
          bottom: 24px;
        }
      }

      @media (max-height: 600px) {
        .star-inner .blow-hint {
          top: 68%;
          font-size: 9px;
        }
        .wish-card .wish-photos {
          height: clamp(70px, 19vw, 86px);
          margin-bottom: 8px;
        }
        .scene--star.is-card .wish-card {
          max-height: min(430px, 74vh);
        }
        .star-badge {
          display: none;
        }
      }

      @media (max-width: 360px) {
        .star-badge {
          display: none;
        }
        .star-inner .blow-hint {
          font-size: 9px;
          letter-spacing: 0.12em;
        }
        .scene--star.is-card .wish-card {
          width: 94%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cake-canvas {
          cursor: default;
        }
      }
    </style>
  </head>

  <body class="theme-night">
    <div class="app">
      <section
        class="scene scene--finale scene--star"
        id="finale"
        data-theme="night"
      >
        <div class="scene-bg finale-bg" aria-hidden="true">
          <div class="night-glow"></div>
          <div class="starfield"></div>
          <div class="bokeh bokeh--a"></div>
          <div class="bokeh bokeh--b"></div>
          <div class="bokeh bokeh--c"></div>
          <div class="night-horizon"></div>
        </div>

        <canvas
          class="cake-canvas"
          id="cakeCanvas"
          aria-label="可以拖动旋转的三维星河生日蛋糕，轻触可以为蜡烛许愿"
        ></canvas>

        <div class="scene-inner finale-inner star-inner">
          <header class="finale-head">
            <h2 class="finale-title finale-title--art">
              <span class="title-glow" aria-hidden="true"></span>
              <img
                src="assets/photos/hbfont-title.webp?v=2"
                alt="生日快乐"
                width="1100"
                height="556"
                decoding="async"
              />
              <span class="title-sparks" aria-hidden="true">
                <i style="--x: 7%; --y: 24%; --s: 8px; --c: #7bdff2; --d: 0s; --t: 4.2s"></i>
                <i style="--x: 92%; --y: 18%; --s: 6px; --c: #ffb6c1; --d: -1.1s; --t: 5s"></i>
                <i style="--x: 15%; --y: 74%; --s: 5px; --c: #ffe7a3; --d: -2.4s; --t: 4.6s"></i>
                <i style="--x: 86%; --y: 70%; --s: 9px; --c: #7bdff2; --d: -0.6s; --t: 5.4s"></i>
                <i style="--x: 51%; --y: 4%; --s: 6px; --c: #ffe7a3; --d: -3.2s; --t: 4.8s"></i>
                <i style="--x: 30%; --y: 92%; --s: 5px; --c: #9af5d0; --d: -1.7s; --t: 5.2s"></i>
                <i style="--x: 70%; --y: 94%; --s: 7px; --c: #ffb6c1; --d: -2.9s; --t: 4.4s"></i>
                <i style="--x: 3%; --y: 52%; --s: 6px; --c: #9af5d0; --d: -0.4s; --t: 5.6s"></i>
                <i style="--x: 98%; --y: 48%; --s: 5px; --c: #ffe7a3; --d: -3.6s; --t: 4.9s"></i>
              </span>
            </h2>
          </header>

          <button class="blow-hint" id="blowHint" type="button">
            轻触烛火许个愿吧
          </button>

          <div class="wish-card" id="wishCard">
            <div class="wish-card-inner">
              <div class="wish-photos" aria-hidden="true">
                <img src="assets/photos/sticker-1.webp" alt="" />
                <img src="assets/photos/sticker-2.webp" alt="" />
                <img src="assets/photos/sticker-3.webp" alt="" />
              </div>
              <p class="wish-eyebrow">Happy Birthday</p>
              <p class="wish-title">生日快乐</p>
              <p class="wish-date" data-birthday>2026.10.20</p>
              <span class="wish-rule" aria-hidden="true"></span>
              <div class="wish-lines">
                <p>愿你新的一岁，步履依然自在，笑容依旧明媚；</p>
                <p>想去的地方都顺遂抵达，想做的事情都如愿以偿。</p>
                <p>23岁的每一天都鲜活热烈，闪闪发光！</p>
                <p>很高兴重新认识你。</p>
                <p>也很高兴，还能祝你生日快乐。</p>
              </div>
              <span class="wish-ornament" aria-hidden="true"></span>
              <span class="wish-signature" aria-hidden="true">
                <img src="assets/photos/signature-avatar.png?v=2" alt="" />
              </span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="grain" aria-hidden="true"></div>

    <script src="js/config.js"></script>
    <script>
      /* ============================================================
         3D 星河丝带蛋糕
         —— 圆柱蛋糕体 + 双数字蜡烛 + 环绕流光丝带 + 3D 星屑
         ============================================================ */
      (function () {
        "use strict";

        var cfg = window.BIRTHDAY_CONFIG || {};

        document.querySelectorAll('[data-name="her"]').forEach(function (el) {
          el.textContent = cfg.herName || "亲爱的你";
        });
        document.querySelectorAll('[data-name="you"]').forEach(function (el) {
          el.textContent = cfg.yourName || "永远爱你的人";
        });
        document.querySelectorAll("[data-birthday]").forEach(function (el) {
          el.textContent = cfg.birthdayLabel || "2026.10.20";
        });

        var canvas = document.getElementById("cakeCanvas");
        var ctx = canvas.getContext("2d");
        var scene = document.getElementById("finale");
        var hint = document.getElementById("blowHint");

        var W = 0;
        var H = 0;
        var DPR = 1;
        var small = false;
        var reduce =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        /* ── 蛋糕的三个世界坐标参数 ───────────────────────────── */
        var CAKE_RADIUS = 132;
        var CAKE_TOP_Y = -22;
        var CAKE_BOTTOM_Y = 112;
        var FOV = 620;

        /* ── 两套色板 ─────────────────────────────────────────
           默认「深海星河」＝原始代码的配色；
           加 ?theme=gold 可切回香槟金版。
           ──────────────────────────────────────────────────── */

        var THEME_OCEAN = {
          bodyEdge: "#17439A",
          bodyShade: "#0A1B3D",
          bodyDeep: "#061539",
          bodyWarmEdge: "#1E3A8A",
          bodyGlow: "#1D4ED8",
          bodyStroke: "rgba(56,189,248,.28)",

          topInner: "#FFF3B0",
          topMid: "#FFD166",
          topOuter: "#38BDF8",
          frostingBase: "#E0F2FE",
          topBlown: ["#BAE6FD", "#0284C7", "#1E3A8A"],

          glowLit: "rgba(56,189,248,.22)",
          glowDim: "rgba(29,78,216,.13)",
          glowMid: "rgba(29,78,216,.07)",

        var rotY = 0.4;

        /* 贺卡是渐变的升起过程，连续采样几次，才知道蛋糕最后会不会被挡住 */

          (function sample() {

            if (performance.now() - t0 < 1800) requestAnimationFrame(sample);

        var puffs = [];

        /* ── 画布尺寸 ────────────────────────────────────────── */
        function resize() {
          W = window.innerWidth;
          H = window.innerHeight;
          DPR = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(W * DPR);
          canvas.height = Math.round(H * DPR);
          canvas.style.width = W + "px";
          canvas.style.height = H + "px";
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          small = Math.min(W, H) < 430;
          buildScene();
          syncHintHost();
          measureCardTop();

        /* ── 场景对象初始化 ──────────────────────────────────── */
        function buildScene() {
          bodyStars.length = 0;
          nebula.length = 0;
          puffs.length = 0;
          sprinkles.length = 0;
          orbitStars.length = 0;
          orbitWords.length = 0;

          var q = small ? 0.62 : 1;

          /* 蛋糕体上的星云光斑 */
          for (var i = 0; i < Math.round(80 * q); i++) {
            var theta = Math.random() * Math.PI * 2;
            nebula.push({
              x: Math.cos(theta) * CAKE_RADIUS * (0.88 + Math.random() * 0.12),
              y:
                CAKE_TOP_Y +
                8 +
                Math.random() * (CAKE_BOTTOM_Y - CAKE_TOP_Y - 14),
              z: Math.sin(theta) * CAKE_RADIUS * (0.88 + Math.random() * 0.12),
              radius: 13 + Math.random() * 24,
              tint: Math.random(),
              phase: Math.random() * Math.PI * 2,
            });
          }

          /* 蛋糕体上嵌着的五角星 / 钻石星 */
          for (var j = 0; j < Math.round(190 * q); j++) {
            var t2 = Math.random() * Math.PI * 2;
            var r2 = CAKE_RADIUS + (Math.random() - 0.3) * 6;
            bodyStars.push({
              x: Math.cos(t2) * r2,
              y:
                CAKE_TOP_Y +
                5 +
                Math.random() * (CAKE_BOTTOM_Y - CAKE_TOP_Y - 8),
              z: Math.sin(t2) * r2,
              size: 2.1 + Math.random() * 5.0,
              colorIdx: Math.floor(Math.random() * palette.stars.length),
              speed: 1.5 + Math.random() * 3.4,
              phase: Math.random() * Math.PI * 2,
              rot: Math.random() * Math.PI * 2,
              five: Math.random() > 0.32,
            });
          }

          /* 顶部一圈奶油裱花 */
          var puffCount = small ? 18 : 24;
          for (var k = 0; k < puffCount; k++) {
            var tk = (k / puffCount) * Math.PI * 2;
            puffs.push({
              x: Math.cos(tk) * (CAKE_RADIUS - 2),
              y: CAKE_TOP_Y - 3,
              z: Math.sin(tk) * (CAKE_RADIUS - 2),
              size: 13.8 + Math.random() * 2.1,
            });
          }

          /* 蛋糕顶面的金色糖星 */
          for (var m = 0; m < Math.round(100 * q); m++) {
            var am = Math.random() * Math.PI * 2;
            var dm = 12 + Math.sqrt(Math.random()) * (CAKE_RADIUS - 20);
            sprinkles.push({
              x: Math.cos(am) * dm,
              y: CAKE_TOP_Y - 1,
              z: Math.sin(am) * dm,
              size: 1.7 + Math.random() * 3.4,
              colorIdx: Math.floor(Math.random() * palette.stars.length),
              phase: Math.random() * Math.PI * 2,
            });
          }

          /* 环绕蛋糕的 3D 星屑 */
          for (var n = 0; n < Math.round(210 * q); n++) {
            orbitStars.push({
              theta: Math.random() * Math.PI * 2,
              dist: 145 + Math.random() * 230,
              y: -180 + Math.random() * 340,
              speedTheta:
                (0.002 + Math.random() * 0.005) *
                (Math.random() > 0.2 ? 1 : -1),
              speedY: -0.12 - Math.random() * 0.32,
              size: 2.0 + Math.random() * 6.2,
              colorIdx: Math.floor(Math.random() * palette.stars.length),
              phase: Math.random() * Math.PI * 2,
              rot: Math.random() * Math.PI * 2,
              five: Math.random() > 0.25,
            });
          }

          /* 环绕漂浮的祝词 */
          for (var p = 0; p < words.length; p++) {
            orbitWords.push({
              theta: (p / words.length) * Math.PI * 2,
              dist: small ? 150 + (p % 2) * 22 : 208 + (p % 2) * 34,
              y: -98 + p * 30,
              word: words[p],
              phase: Math.random() * Math.PI * 2,
            });

        /* ── 投影 ────────────────────────────────────────────── */
        function project(x, y, z, cx, cy, scale) {
          var cosY = Math.cos(rotY);
          var sinY = Math.sin(rotY);
          var rx = x * cosY - z * sinY;
          var rz = x * sinY + z * cosY;

          var cosX = Math.cos(rotX);
          var sinX = Math.sin(rotX);
          var ry = y * cosX - rz * sinX;
          var rz2 = y * sinX + rz * cosX;

          var depth = FOV + rz2 + 180;
          if (depth <= 10) return null;
          var p = (FOV / depth) * scale * intro;

          return {
            x: cx + rx * p,
            y: cy + ry * p,
            z: rz2,
            s: p,
          };
        }

        /* ── 基础图形 ────────────────────────────────────────── */
        function fiveStar(x, y, r, color, alpha, rotation) {
          if (r < 0.6 || alpha <= 0.02) return;
          var inner = r * 0.44;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rotation || 0);
          ctx.beginPath();
          for (var i = 0; i < 10; i++) {
            var rr = i % 2 === 0 ? r : inner;
            var a = (i * Math.PI) / 5 - Math.PI / 2;
            var px = Math.cos(a) * rr;
            var py = Math.sin(a) * rr;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
          ctx.fillStyle = color;
          ctx.fill();
          ctx.restore();
        }

        function diamondStar(x, y, size, color, alpha) {
          if (size < 0.8 || alpha <= 0.02) return;
          var inner = size * 0.22;
          ctx.save();
          ctx.translate(x, y);
          ctx.beginPath();
          ctx.moveTo(0, -size);
          ctx.quadraticCurveTo(inner, -inner, size, 0);
          ctx.quadraticCurveTo(inner, inner, 0, size);
          ctx.quadraticCurveTo(-inner, inner, -size, 0);
          ctx.quadraticCurveTo(-inner, -inner, 0, -size);
          ctx.closePath();
          ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
          ctx.fillStyle = color;
          ctx.fill();
          ctx.restore();
        }

        function roundRect(x, y, w, h, r) {
          r = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
        }

        function mixColor(t, list) {
          var s = (((t % 1) + 1) % 1) * (list.length - 1);
          var i = Math.floor(s);
          var f = s - i;
          var a = list[i];
          var b = list[Math.min(i + 1, list.length - 1)];
          return {
            r: Math.round(a[0] + (b[0] - a[0]) * f),
            g: Math.round(a[1] + (b[1] - a[1]) * f),
            b: Math.round(a[2] + (b[2] - a[2]) * f),
          };
        }

        /* ── 许愿 / 复燃 ─────────────────────────────────────── */
        function blowCandles() {
          if (blown) {
            if (card) relight();
            return;
          }
          blown = true;
          lit = false;
          card = false;
          flash = 1;
          scene.classList.add("is-blown");
          scene.classList.remove("is-card");

          addSmoke();
          addFireworks();

          if (navigator.vibrate) {
            try {
              navigator.vibrate([16, 40, 26]);
            } catch (e) {}
          }

          window.setTimeout(function () {
            if (!blown) return;
            card = true;
            scene.classList.add("is-card");
            trackCardTop();
          }, 1550);
        }

        function relight() {
          blown = false;
          lit = true;
          card = false;
          scene.classList.remove("is-blown", "is-card");
          smoke.length = 0;
          fireworks.length = 0;
        }

        function addSmoke() {
          var tips = candleTips.length
            ? candleTips
            : [
                { x: W / 2 - 34, y: H * 0.42 },
                { x: W / 2 + 34, y: H * 0.42 },
              ];

          for (var i = 0; i < 30; i++) {
            var tip = tips[i % tips.length];
            smoke.push({
              x: tip.x + (Math.random() - 0.5) * 6,
              y: tip.y,
              vx: (Math.random() - 0.5) * 0.7,
              vy: -0.7 - Math.random() * 0.9,
              size: 4 + Math.random() * 6,
              life: 0,
              max: 70 + Math.random() * 40,
            });
          }
        }

        function addFireworks() {
          for (var i = 0; i < (small ? 70 : 105); i++) {
            var theta = Math.random() * Math.PI * 2;
            var phi = (Math.random() - 0.32) * Math.PI;
            var speed = 2.4 + Math.random() * 5.4;
            fireworks.push({
              x: 0,
              y: CAKE_TOP_Y - 58,
              z: 0,
              vx: Math.cos(theta) * Math.cos(phi) * speed,
              vy: Math.sin(phi) * speed - 1.4,
              vz: Math.sin(theta) * Math.cos(phi) * speed,
              size: 3.4 + Math.random() * 5.4,
              colorIdx: Math.floor(Math.random() * palette.stars.length),
              alpha: 1,
              rot: Math.random() * Math.PI * 2,
            });
          }
        }

        /* ── 主渲染 ──────────────────────────────────────────── */
        function render(now) {
          var dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0.016;
          lastT = now;
          time += dt;

          intro += (1 - intro) * Math.min(1, dt * 4.5);
          cardEase += ((card ? 1 : 0) - cardEase) * Math.min(1, dt * 5);
          flameLevel += ((lit ? 1 : 0) - flameLevel) * Math.min(1, dt * 10);
          flash = Math.max(0, flash - dt * 0.75);

          if (!dragging && !reduce) {
            rotY += (0.16 + dragVel) * dt;
            dragVel *= Math.pow(0.05, dt);
          } else if (!dragging) {
            dragVel *= Math.pow(0.05, dt);
          }
          rotX += (targetRotX - rotX) * Math.min(1, dt * 8);

          var fit = Math.min(W, H);
          /* 手机竖屏把蛋糕放大到约占屏宽 2/3，平板 / 桌面沿用原来的尺寸曲线 */
          var baseScale =
            fit < 520
              ? Math.max(0.98, Math.min(1.28, fit / 330))
              : Math.min(1.35, 1.28 + (fit - 520) / 420);
          /* 贺卡出现后蛋糕退到画面上方，给加了照片的贺卡让出空间 */
          var cardScale = H < 640 ? 0.42 : 0.5;
          var scale = baseScale * (1 - (1 - cardScale) * cardEase);

          var cx = W / 2;
          var cy = H * (0.5 - 0.17 * cardEase);

          ctx.clearRect(0, 0, W, H);

          /* 蛋糕背后的暖光 */
          var glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, 330 * scale);
          glow.addColorStop(0, lit ? palette.glowLit : palette.glowDim);
          glow.addColorStop(0.5, palette.glowMid);
          glow.addColorStop(1, palette.glowEnd);
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, W, H);

          var topCenter = project(0, CAKE_TOP_Y, 0, cx, cy, scale);
          var botCenter = project(0, CAKE_BOTTOM_Y, 0, cx, cy, scale);

          var plateBottom = null;
          if (botCenter) {
            plateBottom =
              botCenter.y +
              4 * scale +
              CAKE_RADIUS * botCenter.s * 1.12 * Math.sin(rotX) * 0.92;
          }

          /* 提示语始终落在托盘下沿的下方，避免蛋糕放大后被压住 */
          if (hint && plateBottom !== null) {
            var nextHint = Math.min(H * 0.85, plateBottom + 18) - hintHostTop;
            if (Math.abs(nextHint - hintTop) > 0.5) {
              hintTop = nextHint;
              hint.style.top = nextHint.toFixed(1) + "px";
            }
          }

          /* 贺卡已经把蛋糕挡住时，让蛋糕淡出，免得露出一截被切开的边缘 */
          if (plateBottom !== null && cardTopPx < Infinity) {
            canvas.classList.toggle(
              "is-tucked",
              card && cardEase > 0.4 && plateBottom > cardTopPx + 6
            );
          } else {
            canvas.classList.remove("is-tucked");
          }

          /* 地面反光 */
          if (botCenter) {
            var rxBotGlow = CAKE_RADIUS * botCenter.s;
            var ryBotGlow = rxBotGlow * Math.sin(rotX);
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(
              botCenter.x,
              botCenter.y + 8 * scale,
              rxBotGlow * 1.2,
              ryBotGlow * 1.2,
              0,
              0,
              Math.PI * 2,
            );
            var floor = ctx.createRadialGradient(
              botCenter.x,
              botCenter.y + 8 * scale,
              rxBotGlow * 0.2,
              botCenter.x,
              botCenter.y + 8 * scale,
              rxBotGlow * 1.25,
            );
            floor.addColorStop(0, palette.floor0);
            floor.addColorStop(0.6, palette.floor1);
            floor.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = floor;
            ctx.fill();
            ctx.restore();

            /* 香槟金托盘 */
            var plateR = CAKE_RADIUS * botCenter.s * 1.12;
            var plateRy = plateR * Math.sin(rotX) * 0.92;
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(
              botCenter.x,
              botCenter.y + 7 * scale,
              plateR * 1.02,
              plateRy * 1.04,
              0,
              0,
              Math.PI * 2,
            );
            ctx.fillStyle = "rgba(6,9,16,.55)";
            ctx.fill();

            var plateGrad = ctx.createLinearGradient(
              botCenter.x - plateR,
              botCenter.y,
              botCenter.x + plateR,
              botCenter.y + plateRy,
            );
            plateGrad.addColorStop(0, palette.plate0);
            plateGrad.addColorStop(0.42, palette.plate1);
            plateGrad.addColorStop(0.78, palette.plate2);
            plateGrad.addColorStop(1, palette.plateWarm);
            ctx.beginPath();
            ctx.ellipse(
              botCenter.x,
              botCenter.y + 4 * scale,
              plateR,
              plateRy,
              0,
              0,
              Math.PI * 2,
            );
            ctx.fillStyle = plateGrad;
            ctx.fill();
            ctx.strokeStyle = palette.plateEdge;
            ctx.lineWidth = 1.1;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(
              botCenter.x,
              botCenter.y + 4 * scale,
              plateR * 0.955,
              plateRy * 0.955,
              0,
              0,
              Math.PI * 2,
            );
            ctx.strokeStyle = palette.plateHighlight;
            ctx.lineWidth = 0.8;
            ctx.stroke();
            ctx.restore();
          }

          /* 圆柱蛋糕体 */
          if (topCenter && botCenter) {
            var rxTop = CAKE_RADIUS * topCenter.s;
            var ryTop = rxTop * Math.sin(rotX);
            var rxBot = CAKE_RADIUS * botCenter.s;
            var ryBot = rxBot * Math.sin(rotX);

            ctx.save();
            ctx.beginPath();
            ctx.ellipse(
              topCenter.x,
              topCenter.y,
              rxTop,
              ryTop,
              0,
              Math.PI,
              0,
              false,
            );
            ctx.lineTo(botCenter.x + rxBot, botCenter.y);
            ctx.ellipse(
              botCenter.x,
              botCenter.y,
              rxBot,
              ryBot,
              0,
              0,
              Math.PI,
              false,
            );
            ctx.closePath();

            var body = ctx.createLinearGradient(
              topCenter.x - rxTop,
              topCenter.y,
              topCenter.x + rxTop,
              botCenter.y,
            );
            body.addColorStop(0, palette.bodyEdge);
            body.addColorStop(0.26, palette.bodyShade);
            body.addColorStop(0.62, palette.bodyDeep);
            body.addColorStop(0.88, palette.bodyWarmEdge);
            body.addColorStop(1, palette.bodyGlow);
            ctx.fillStyle = body;
            ctx.fill();

            /* 顶部暖光洒在蛋糕体上 */
            var bleed = ctx.createLinearGradient(
              0,
              topCenter.y,
              0,
              botCenter.y,
            );
            bleed.addColorStop(0, lit ? palette.bleedLit : palette.bleedDim);
            bleed.addColorStop(0.4, palette.bleedMid);
            bleed.addColorStop(1, palette.bleedBottom);
            ctx.fillStyle = bleed;
            ctx.fill();

            ctx.strokeStyle = palette.bodyStroke;
            ctx.lineWidth = 1;
            ctx.stroke();

            /* 蛋糕体上的两道缎带 */
            drawBand(
              -14,
              -4,
              cx,
              cy,
              scale,
              palette.bandTop,
              palette.bandTopEdge,
            );
            drawBand(
              88,
              98,
              cx,
              cy,
              scale,
              palette.bandBottom,
              palette.bandBottomEdge,
            );
            ctx.restore();
          }

          /* 收集需要按深度排序的元素 */
          var queue = [];

          /* 流光丝带 */
          var steps = small ? 58 : 72;
          RIBBONS.forEach(function (rc, ri) {
            var pts = [];
            for (var i = 0; i <= steps; i++) {
              var f = i / steps;
              var ang = f * Math.PI * 2 * rc.turns + rc.phase - time * rc.speed;
              var rad =
                rc.rStart +
                (rc.rEnd - rc.rStart) * f +
                Math.sin(f * Math.PI * 4 + time) * 8;
              var yy =
                rc.yStart +
                (rc.yEnd - rc.yStart) * f +
                Math.cos(f * Math.PI * 3 - time) * 6;
              var twist = Math.sin(f * Math.PI * 5 - time * 1.4 + ri);
              var hw = rc.width * (0.25 + 0.75 * Math.abs(twist));

              var a = project(
                Math.cos(ang) * rad,
                yy - hw,
                Math.sin(ang) * rad,
                cx,
                cy,
                scale,
              );
              var b = project(
                Math.cos(ang) * rad,
                yy + hw,
                Math.sin(ang) * rad,
                cx,
                cy,
                scale,
              );
              if (a && b) pts.push({ a: a, b: b, f: f, z: (a.z + b.z) * 0.5 });
            }
            for (var q2 = 0; q2 < pts.length - 1; q2++) {
              var s1 = pts[q2];
              var s2 = pts[q2 + 1];
              queue.push({
                type: "ribbon",
                z: (s1.z + s2.z) * 0.5,
                a: s1.a,
                b: s1.b,
                c: s2.a,
                d: s2.b,
                color: mixColor(
                  s1.f + time * 0.08 + ri * 0.25,
                  palette.ribbons,
                ),
                alpha: 0.56 * Math.sin(s1.f * Math.PI),
              });
            }
          });

          /* 星云 */
          nebula.forEach(function (nb) {
            var p = project(nb.x, nb.y, nb.z, cx, cy, scale);
            if (p && p.z < 35) {
              queue.push({
                type: "nebula",
                z: p.z,
                x: p.x,
                y: p.y,
                r: nb.radius * p.s,
                tint: nb.tint,
                alpha:
                  (0.16 + 0.08 * Math.sin(time * 2 + nb.phase)) *
                  (1 - Math.max(0, p.z / 40)),
              });
            }
          });

          /* 蛋糕体上的星星 */
          bodyStars.forEach(function (st) {
            var p = project(st.x, st.y, st.z, cx, cy, scale);
            if (p && p.z < 20) {
              var tw = 0.55 + 0.45 * Math.sin(time * st.speed + st.phase);
              queue.push({
                type: "star",
                z: p.z - 2,
                x: p.x,
                y: p.y,
                size: st.size * p.s * (0.85 + 0.3 * tw),
                color: palette.stars[st.colorIdx % palette.stars.length],
                alpha: tw * (1 - Math.max(0, p.z / 25)),
                rot: st.rot + time * 0.3,
                five: st.five,
              });
            }
          });

          /* 环绕星屑 */
          orbitStars.forEach(function (os) {
            os.theta += os.speedTheta;
            os.y += os.speedY;
            if (os.y < -190) os.y = 160;

            var p = project(
              Math.cos(os.theta) * os.dist,
              os.y,
              Math.sin(os.theta) * os.dist,
              cx,
              cy,
              scale,
            );
            if (p) {
              var tw2 = 0.45 + 0.55 * Math.sin(time * 2.5 + os.phase);
              queue.push({
                type: "star",
                z: p.z,
                x: p.x,
                y: p.y,
                size: os.size * p.s,
                color: palette.stars[os.colorIdx % palette.stars.length],
                alpha: tw2 * 0.9,
                rot: os.rot + time * 0.4,
                five: os.five,
              });
            }
          });

          /* 祝词 */
          orbitWords.forEach(function (ow, oi) {
            ow.theta += 0.0035;
            var p = project(
              Math.cos(ow.theta) * ow.dist,
              ow.y + Math.sin(time * 1.5 + oi) * 8,
              Math.sin(ow.theta) * ow.dist,
              cx,
              cy,
              scale,
            );
            if (p) {
              queue.push({
                type: "word",
                z: p.z,
                x: p.x,
                y: p.y,
                s: p.s,
                text: ow.word,
              });
            }
          });

          queue.sort(function (a, b) {
            return b.z - a.z;
          });

          /* 蛋糕后方的元素 */
          queue.forEach(function (item) {
            if (item.z > 0) drawItem(item);
          });

          /* 蛋糕顶面 */
          if (topCenter) {
            var trx = CAKE_RADIUS * topCenter.s;
            var try2 = trx * Math.sin(rotX);

            ctx.save();
            ctx.beginPath();
            ctx.ellipse(topCenter.x, topCenter.y, trx, try2, 0, 0, Math.PI * 2);
            var topGrad = ctx.createRadialGradient(
              topCenter.x,
              topCenter.y,
              trx * 0.04,
              topCenter.x,
              topCenter.y,
              trx,
            );
            if (lit) {
              topGrad.addColorStop(0, "#FFFFFF");
              topGrad.addColorStop(0.24, palette.topInner);
              topGrad.addColorStop(0.58, palette.topMid);
              topGrad.addColorStop(0.86, palette.topOuter);
              topGrad.addColorStop(1, palette.frostingBase);
            } else {
              topGrad.addColorStop(0, palette.topBlown[0]);
              topGrad.addColorStop(0.5, palette.topBlown[1]);
              topGrad.addColorStop(1, palette.topBlown[2]);
            }
            ctx.fillStyle = topGrad;
            ctx.fill();
            ctx.restore();

            drawTopRing(112, cx, cy, scale, palette.ring1, 1);
            drawTopRing(92, cx, cy, scale, palette.ring2, 0.8);

            /* 顶面糖星 */
            sprinkles.forEach(function (sp) {
              var p = project(sp.x, sp.y, sp.z, cx, cy, scale);
              if (p) {
                fiveStar(
                  p.x,
                  p.y,
                  sp.size * p.s,
                  palette.stars[sp.colorIdx % palette.stars.length],
                  0.85,
                  sp.phase,
                );
              }
            });
          }

          /* 奶油裱花（按深度分成前后两半） */
          var projectedPuffs = [];
          puffs.forEach(function (pf) {
            var p = project(pf.x, pf.y, pf.z, cx, cy, scale);
            if (p)
              projectedPuffs.push({ x: p.x, y: p.y, z: p.z, r: pf.size * p.s });
          });
          projectedPuffs.sort(function (a, b) {
            return b.z - a.z;
          });

          projectedPuffs.forEach(function (pf) {
            if (pf.z > 0) drawPuff(pf);
          });

          /* 两支数字蜡烛：始终以屏幕左右固定朝向站立，
             蛋糕转动时「2」「3」的阅读顺序不会颠倒 */
          var candleBase = project(0, CAKE_TOP_Y - 2, 0, cx, cy, scale);
          var candleTop = project(0, CAKE_TOP_Y - 66, 0, cx, cy, scale);
          var candleWick = project(0, CAKE_TOP_Y - 75, 0, cx, cy, scale);

          if (candleBase && candleTop && candleWick) {
            var cs = candleBase.s;
            var cdx = 34 * cs;
            candleTips = [
              { x: candleBase.x - cdx, y: candleWick.y },
              { x: candleBase.x + cdx, y: candleWick.y },
            ];
            drawNumeralCandle(
              candleBase.x - cdx,
              candleBase.y,
              candleTop.y,
              candleWick.y,
              cs,
              "2",
            );
            drawNumeralCandle(
              candleBase.x + cdx,
              candleBase.y,
              candleTop.y,
              candleWick.y,
              cs,
              "3",
            );
          }

          projectedPuffs.forEach(function (pf) {
            if (pf.z <= 0) drawPuff(pf);
          });

          /* 蛋糕前方的元素 */
          queue.forEach(function (item) {
            if (item.z <= 0) drawItem(item);
          });

          drawEffects(cx, cy, scale, topCenter);

          /* 吹灭瞬间的金色闪光 */
          if (flash > 0.01 && topCenter) {
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            var fr = 240 * scale * (1.2 - flash * 0.2);
            var fg = ctx.createRadialGradient(
              topCenter.x,
              topCenter.y - 30 * scale,
              2,
              topCenter.x,
              topCenter.y - 30 * scale,
              fr,
            );
            fg.addColorStop(
              0,
              "rgba(" + palette.flash0 + "," + (0.55 * flash).toFixed(3) + ")",
            );
            fg.addColorStop(
              0.35,
              "rgba(" + palette.flash1 + "," + (0.24 * flash).toFixed(3) + ")",
            );
            fg.addColorStop(1, "rgba(" + palette.flash1 + ",0)");
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.arc(topCenter.x, topCenter.y - 30 * scale, fr, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          requestAnimationFrame(render);
        }

        /* ── 元素绘制 ────────────────────────────────────────── */
        function drawItem(item) {
          if (item.type === "ribbon") {
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.beginPath();
            ctx.moveTo(item.a.x, item.a.y);
            ctx.lineTo(item.c.x, item.c.y);
            ctx.lineTo(item.d.x, item.d.y);
            ctx.lineTo(item.b.x, item.b.y);
            ctx.closePath();
            ctx.fillStyle =
              "rgba(" +
              item.color.r +
              "," +
              item.color.g +
              "," +
              item.color.b +
              "," +
              (item.alpha * 0.6).toFixed(3) +
              ")";
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(item.a.x, item.a.y);
            ctx.lineTo(item.c.x, item.c.y);
            ctx.strokeStyle =
              "rgba(255,250,235," + (item.alpha * 0.45).toFixed(3) + ")";
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.restore();
          } else if (item.type === "nebula") {
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            var c =
              item.tint > 0.62
                ? palette.nebulaA
                : item.tint > 0.28
                  ? palette.nebulaB
                  : palette.nebulaC;
            var g = ctx.createRadialGradient(
              item.x,
              item.y,
              1,
              item.x,
              item.y,
              item.r,
            );
            g.addColorStop(0, "rgba(" + c + "," + item.alpha.toFixed(3) + ")");
            g.addColorStop(1, "rgba(" + c + ",0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          } else if (item.type === "star") {
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            if (item.five) {
              fiveStar(
                item.x,
                item.y,
                item.size,
                item.color,
                item.alpha,
                item.rot,
              );
            } else {
              diamondStar(
                item.x,
                item.y,
                item.size * 1.25,
                item.color,
                item.alpha,
              );
            }
            ctx.restore();
          } else if (item.type === "word") {
            var alpha = Math.max(0.1, Math.min(0.55, (200 - item.z) / 420));
            ctx.save();
            ctx.font =
              "500 " +
              Math.max(8, Math.round(11.5 * item.s)) +
              'px "Cormorant Garamond", "Noto Serif SC", serif';
            ctx.fillStyle =
              "rgba(" + palette.wordColor + "," + alpha.toFixed(3) + ")";
            ctx.shadowColor = palette.wordShadow;
            ctx.shadowBlur = 8;
            ctx.textAlign = "center";
            ctx.fillText(item.text, item.x, item.y);
            ctx.restore();
          }
        }

        /* 沿圆柱面画一圈横向缎带（只画朝向镜头的前半圈） */
        function drawBand(yTop, yBottom, cx, cy, scale, fill, edge) {
          var n = small ? 34 : 46;
          var prev = null;
          ctx.save();
          ctx.fillStyle = fill;
          ctx.strokeStyle = edge;
          ctx.lineWidth = 1;
          ctx.beginPath();

          for (var i = 0; i <= n; i++) {
            var a = (i / n) * Math.PI * 2;
            var x = Math.cos(a) * CAKE_RADIUS;
            var z = Math.sin(a) * CAKE_RADIUS;
            var p1 = project(x, yTop, z, cx, cy, scale);
            var p2 = project(x, yBottom, z, cx, cy, scale);
            var cur = p1 && p2 ? { a: p1, b: p2 } : null;

            if (prev && cur) {
              var depth = (prev.a.z + prev.b.z + cur.a.z + cur.b.z) / 4;
              if (depth <= 0) {
                ctx.moveTo(prev.a.x, prev.a.y);
                ctx.lineTo(cur.a.x, cur.a.y);
                ctx.lineTo(cur.b.x, cur.b.y);
                ctx.lineTo(prev.b.x, prev.b.y);
                ctx.closePath();
              }
            }
            prev = cur;
          }
          ctx.fill();
          ctx.restore();
        }

        /* 蛋糕顶面的一圈金线 */
        function drawTopRing(radius, cx, cy, scale, color, width) {
          var n = small ? 44 : 60;
          ctx.save();
          ctx.beginPath();
          var started = false;
          for (var i = 0; i <= n; i++) {
            var a = (i / n) * Math.PI * 2;
            var p = project(
              Math.cos(a) * radius,
              CAKE_TOP_Y - 1,
              Math.sin(a) * radius,
              cx,
              cy,
              scale,
            );
            if (!p) continue;
            if (!started) {
              ctx.moveTo(p.x, p.y);
              started = true;
            } else {
              ctx.lineTo(p.x, p.y);
            }
          }
          ctx.strokeStyle = color;
          ctx.lineWidth = width;
          ctx.stroke();
          ctx.restore();
        }

        function drawPuff(pf) {
          var r = pf.r;
          ctx.save();
          var g = ctx.createRadialGradient(
            pf.x - r * 0.22,
            pf.y - r * 0.28,
            r * 0.08,
            pf.x,
            pf.y,
            r,
          );
          if (lit) {
            g.addColorStop(0, palette.puffLit[0]);
            g.addColorStop(0.42, palette.puffLit[1]);
            g.addColorStop(0.8, palette.puffLit[2]);
            g.addColorStop(1, palette.puffLit[3]);
          } else {
            g.addColorStop(0, palette.puffDim[0]);
            g.addColorStop(0.6, palette.puffDim[1]);
            g.addColorStop(1, palette.puffDim[2]);
          }
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(pf.x, pf.y, r, 0, Math.PI * 2);
          ctx.fill();

          /* 裱花的小高光 */
          ctx.beginPath();
          ctx.arc(pf.x - r * 0.26, pf.y - r * 0.3, r * 0.2, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,255,255,.55)";
          ctx.fill();
          ctx.restore();
        }

        function drawNumeralCandle(x, baseY, topY, wickY, s, numeral) {
          var w = 30 * s;
          var h = baseY - topY;

          /* 烛光在顶面投下的小光斑 */
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(
            x,
            baseY + h * 0.02,
            w * 0.85,
            w * 0.28,
            0,
            0,
            Math.PI * 2,
          );
          ctx.fillStyle = lit
            ? "rgba(255,247,222,.55)"
            : "rgba(230,220,200,.28)";
          ctx.fill();
          ctx.restore();

          /* 蜡烛柱身 */
          ctx.save();
          var body = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
          body.addColorStop(0, palette.candleBody[0]);
          body.addColorStop(0.4, palette.candleBody[1]);
          body.addColorStop(0.72, palette.candleBody[2]);
          body.addColorStop(1, palette.candleBody[3]);
          roundRect(x - w / 2, topY, w, h, w * 0.3);
          ctx.fillStyle = body;
          ctx.fill();
          ctx.strokeStyle = palette.candleStroke;
          ctx.lineWidth = 0.8;
          ctx.stroke();

          /* 数字 */
          ctx.font =
            "600 " +
            Math.round(h * 0.56) +
            'px "Cormorant Garamond", "Noto Serif SC", serif';
          ctx.fillStyle = palette.candleNumeral;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(numeral, x, topY + h * 0.55);
          ctx.restore();

          /* 烛芯 */
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(x, topY);
          ctx.lineTo(x, wickY);
          ctx.strokeStyle = "#3A2C1C";
          ctx.lineWidth = Math.max(1, 1.8 * s);
          ctx.lineCap = "round";
          ctx.stroke();
          ctx.restore();

          if (flameLevel > 0.03) {
            drawFlame({ x: x, y: wickY }, s);
          } else {
            /* 熄灭后的余烬 */
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, wickY, Math.max(1.2, 2.2 * s), 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,150,80,.65)";
            ctx.shadowColor = "rgba(255,120,40,.8)";
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();
          }
        }

        function drawFlame(wick, s) {
          var k = flameLevel;
          var flickX =
            (Math.sin(time * 13) * 1.6 + Math.cos(time * 23) * 1.1) * s;
          var fh = (30 + Math.sin(time * 17) * 3.2) * s * k;
          var fw = (9.2 + Math.cos(time * 19) * 1.0) * s * k;
          var alpha = Math.min(1, k * 1.2);

          ctx.save();
          ctx.globalCompositeOperation = "lighter";

          /* 光晕 */
          var haloR = 62 * s * k;
          var halo = ctx.createRadialGradient(
            wick.x,
            wick.y - fh * 0.3,
            1,
            wick.x,
            wick.y - fh * 0.3,
            haloR,
          );
          halo.addColorStop(
            0,
            "rgba(255,244,190," + (0.55 * alpha).toFixed(3) + ")",
          );
          halo.addColorStop(
            0.32,
            "rgba(255,196,110," + (0.24 * alpha).toFixed(3) + ")",
          );
          halo.addColorStop(
            0.72,
            "rgba(255,170,80," + (0.06 * alpha).toFixed(3) + ")",
          );
          halo.addColorStop(1, "rgba(255,170,80,0)");
          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(wick.x, wick.y - fh * 0.3, haloR, 0, Math.PI * 2);
          ctx.fill();

          /* 水滴形外焰 */
          ctx.beginPath();
          ctx.moveTo(wick.x, wick.y + 2);
          ctx.bezierCurveTo(
            wick.x - fw,
            wick.y - fh * 0.25,
            wick.x - fw * 0.5 + flickX,
            wick.y - fh * 0.8,
            wick.x + flickX,
            wick.y - fh,
          );
          ctx.bezierCurveTo(
            wick.x + fw * 0.5 + flickX,
            wick.y - fh * 0.8,
            wick.x + fw,
            wick.y - fh * 0.25,
            wick.x,
            wick.y + 2,
          );
          var fg = ctx.createLinearGradient(
            wick.x,
            wick.y,
            wick.x + flickX,
            wick.y - fh,
          );
          fg.addColorStop(0, "rgba(255,214,120,.85)");
          fg.addColorStop(0.3, "rgba(255,249,228,.98)");
          fg.addColorStop(0.68, "rgba(255,205,105,.95)");
          fg.addColorStop(1, "rgba(255,170,70,.55)");
          ctx.fillStyle = fg;
          ctx.globalAlpha = alpha;
          ctx.fill();

          /* 内焰 */
          ctx.beginPath();
          ctx.ellipse(
            wick.x + flickX * 0.25,
            wick.y - fh * 0.32,
            fw * 0.3,
            fh * 0.3,
            0,
            0,
            Math.PI * 2,
          );
          ctx.fillStyle = "#FFFFFF";
          ctx.fill();
          ctx.restore();
        }

        function drawEffects(cx, cy, scale, topCenter) {
          /* 白烟 */
          for (var i = smoke.length - 1; i >= 0; i--) {
            var sp = smoke[i];
            sp.x += sp.vx + Math.sin(time * 3 + i) * 0.18;
            sp.y += sp.vy;
            sp.life++;
            sp.size += 0.16;
            if (sp.life >= sp.max) {
              smoke.splice(i, 1);
              continue;
            }
            var a = (1 - sp.life / sp.max) * 0.4;
            ctx.save();
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(232,226,212," + a.toFixed(3) + ")";
            ctx.fill();
            ctx.restore();
          }

          /* 星屑烟花 */
          for (var j = fireworks.length - 1; j >= 0; j--) {
            var fw = fireworks[j];
            fw.x += fw.vx;
            fw.y += fw.vy;
            fw.z += fw.vz;
            fw.vy += 0.085;
            fw.vx *= 0.985;
            fw.vz *= 0.985;
            fw.alpha -= 0.012;
            if (fw.alpha <= 0) {
              fireworks.splice(j, 1);
              continue;
            }
            var p2 = project(fw.x, fw.y, fw.z, cx, cy, scale);
            if (p2) {
              ctx.save();
              ctx.globalCompositeOperation = "lighter";
              fiveStar(
                p2.x,
                p2.y,
                fw.size * p2.s,
                palette.stars[fw.colorIdx % palette.stars.length],
                fw.alpha,
                fw.rot + time * 2,
              );
              ctx.restore();
            }
          }
        }

        /* ── 指针交互 ────────────────────────────────────────── */
        canvas.addEventListener("pointerdown", function (e) {
          dragging = true;
          moved = 0;
          lastX = e.clientX;
          lastY = e.clientY;
          canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
        });

        canvas.addEventListener("pointermove", function (e) {
          if (!dragging) return;
          var dx = e.clientX - lastX;
          var dy = e.clientY - lastY;
          moved += Math.abs(dx) + Math.abs(dy);
          lastX = e.clientX;
          lastY = e.clientY;

          rotY += dx * 0.007;
          dragVel = dx * 0.0012;
          targetRotX = Math.max(0.14, Math.min(0.72, targetRotX + dy * 0.005));
          rotX = targetRotX;
        });

        function endDrag() {
          if (!dragging) return;
          dragging = false;
          if (moved < 9) blowCandles();
        }

        canvas.addEventListener("pointerup", endDrag);
        canvas.addEventListener("pointercancel", function () {
          dragging = false;
        });

        hint.addEventListener("click", function (e) {
          e.stopPropagation();
          blowCandles();
        });

        window.addEventListener("resize", resize);
        window.addEventListener("orientationchange", function () {
          window.setTimeout(resize, 260);
        });
        window.addEventListener("load", syncHintHost);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(syncHintHost);
        }

        resize();
        requestAnimationFrame(render);
      })();

      /* 标题与星屑的指针视差：让字图不再像一张贴在背景上的静态图 */
      (function () {
        var art = document.querySelector(".finale-title--art");
        if (!art) return;
        var scene = document.querySelector(".scene--star");

        function place(x, y) {
          var tx = -x * 7;
          var ty = -y * 5;
          art.style.setProperty("--tp-x", tx.toFixed(2) + "px");
          art.style.setProperty("--tp-y", ty.toFixed(2) + "px");
          if (scene) {
            scene.style.setProperty("--mx", (tx / 8).toFixed(3));
            scene.style.setProperty("--my", (ty / 8).toFixed(3));
          }
        }

        window.addEventListener(
          "pointermove",
          function (e) {
            place(
              (e.clientX / window.innerWidth - 0.5) * 2,
              (e.clientY / window.innerHeight - 0.5) * 2
            );
          },
          { passive: true }
        );

        window.addEventListener("pointerup", function () {
          place(0, 0);
        });
        window.addEventListener("pointercancel", function () {
          place(0, 0);
        });

        art.addEventListener("pointerdown", function () {
          art.classList.remove("is-sparking");
          void art.offsetWidth;
          art.classList.add("is-sparking");
          window.setTimeout(function () {
            art.classList.remove("is-sparking");
          }, 950);
        });
      })();
    </script>
  </body>
</html>
